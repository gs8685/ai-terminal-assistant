name: Build & Release Binary Executables

on:
  push:
    branches: [ main, cli-package ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, cli-package ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Build & Smoke Test Binaries (Matrix)
  # ==========================================
  build:
    name: Build Binary (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: cli-agent-windows-amd64.exe
            python_arch: x64
          - os: macos-latest
            asset_name: cli-agent-darwin-arm64
            python_arch: arm64
            macos_target: "11.0"
          - os: macos-latest
            asset_name: cli-agent-darwin-amd64
            python_arch: x64
            macos_target: "11.0"
          - os: ubuntu-latest
            asset_name: cli-agent-linux-amd64
            python_arch: x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch || 'x64' }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<70.0.0" wheel
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Executable Binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '11.0' }}
        run: python build_installer.py

      - name: Rename Artifact for OS Matrix
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv dist/cli-agent.exe dist/${{ matrix.asset_name }}
          else
            mv dist/cli-agent dist/${{ matrix.asset_name }}
          fi

      - name: Automated CI Smoke Testing
        shell: bash
        run: |
          echo "=== RUNNING AUTOMATED SMOKE TESTS ==="
          EXE_TARGET="./dist/${{ matrix.asset_name }}"
          chmod +x "$EXE_TARGET" 2>/dev/null || true
          
          if [[ "${{ matrix.os }}" == macos* ]]; then
            echo "Applying ad-hoc code signature for macOS target..."
            codesign --force --deep --sign - "$EXE_TARGET" 2>/dev/null || true
          fi

          set +e
          OUTPUT=$("$EXE_TARGET" --help 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Exit Code: $EXIT_CODE"
          echo "Output from binary execution:"
          echo "$OUTPUT"
          
          if echo "$OUTPUT" | grep -q -i "AI Command Line Agent Interface" || [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Smoke test PASSED: Binary initialized successfully on ${{ matrix.os }}!"
          else
            echo "❌ Smoke test FAILED: Unexpected output or initialization failure!"
            exit 1
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 7

  # ==========================================
  # JOB 2: Create Unified GitHub Release
  # ==========================================
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}